<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="#0B1220"/>

  <!-- outer scan ring (aperture / lens motif, evokes imaging + focus) -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#teal)" stroke-width="10"/>

  <!-- scan line crossing the ring -->
  <rect x="48" y="122" width="160" height="12" rx="6" fill="url(#teal)"/>

  <!-- focal dot, offset upper-right, amber accent for "finding/flag" -->
  <circle cx="176" cy="80" r="10" fill="#F59E0B"/>

  <!-- bottom arc segment, suggests an open aperture / letter "L" negative space -->
  <path d="M 128 200 A 72 72 0 0 1 74 176" fill="none" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
</svg>
